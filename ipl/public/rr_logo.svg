<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="rrPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3385"/>
      <stop offset="100%" stop-color="#d81373"/>
    </linearGradient>
    <linearGradient id="rrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#c99225"/>
    </linearGradient>
    <linearGradient id="rrBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142a5c"/>
      <stop offset="100%" stop-color="#0a1530"/>
    </linearGradient>
  </defs>
  <!-- Shield Background -->
  <path d="M 50,4 C 76,4 90,14 90,38 C 90,68 50,96 50,96 C 50,96 10,68 10,38 C 10,14 24,4 50,4 Z" fill="url(#rrBlue)" stroke="url(#rrGold)" stroke-width="2.5"/>
  <!-- Inner Shield Trim -->
  <path d="M 50,9 C 72,9 84,18 84,38 C 84,64 50,89 50,89 C 50,89 16,64 16,38 C 16,18 28,9 50,9 Z" fill="url(#rrPink)" opacity="0.95"/>
  <!-- Crown on Top -->
  <path d="M 33,26 L 41,33 L 50,22 L 59,33 L 67,26 L 64,38 L 36,38 Z" fill="url(#rrGold)"/>
  <circle cx="33" cy="24" r="2" fill="url(#rrGold)"/>
  <circle cx="50" cy="20" r="2.5" fill="url(#rrGold)"/>
  <circle cx="67" cy="24" r="2" fill="url(#rrGold)"/>
  <!-- RR Monogram -->
  <text x="50" y="65" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">RR</text>
  <!-- Lower Stars / Accent -->
  <path d="M 43,73 L 50,69 L 57,73 L 50,75 Z" fill="url(#rrGold)"/>
</svg>